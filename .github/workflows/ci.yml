name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Type checking ────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeCheck — packages/db
        run: pnpm --filter @criteria/db exec tsc --noEmit

      - name: TypeCheck — apps/api
        run: pnpm --filter api exec tsc --noEmit

  # ── Tests (non-integration) ──────────────────────────────────────────────────
  test-unit:
    name: Unit + Schema Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run unit + security tests
        run: pnpm --filter api exec vitest run --reporter=verbose
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test_placeholder
          BETTER_AUTH_SECRET: test-secret-value-that-is-at-least-32-chars-long
          BETTER_AUTH_URL: http://localhost:3001
          # No ANTHROPIC_API_KEY — LLM tests are Level 3 (skipped in CI)
          LOG_LEVEL: error

  # ── Security audit ────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: npm audit (critical + high CVEs)
        run: pnpm audit --audit-level=high
        # Allow failure — pnpm audit returns 1 if vulnerabilities found
        # In a mature project, change to: continue-on-error: false
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          # Fail if any of these patterns appear in source files (not .env, not tests)
          if grep -rn \
            --include="*.ts" \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude="*.test.ts" \
            -E "(sk-ant-api|sk-lf-|AIzaSy|Bearer [A-Za-z0-9_\-]{20,})" \
            apps/ packages/ 2>/dev/null; then
            echo "::error::Hardcoded secret detected in source files"
            exit 1
          fi
          echo "No hardcoded secrets found"
