name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # Never cancel in-progress deploys

jobs:
  # ── Guard: must pass CI first ─────────────────────────────────────────────────
  # This job has no steps — it just waits for ci.yml to finish via required status checks
  # Set up in GitHub → Settings → Branches → Require status checks to pass.

  # ── Deploy API → Railway ──────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API (Railway)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service api --environment ${{ github.event.inputs.environment || 'staging' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: apps/api

      - name: Health check post-deploy
        run: |
          # Wait for Railway deploy to complete (Railway CLI is async)
          sleep 30
          HEALTH_URL="${{ vars.API_URL }}/health"
          echo "Checking $HEALTH_URL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed (HTTP $STATUS)"

  # ── Deploy Admin UI → Vercel ──────────────────────────────────────────────────
  deploy-admin:
    name: Deploy Admin UI (Vercel)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy Admin to Vercel
        run: |
          npx vercel --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_TEAM_ID" \
            ${{ github.event.inputs.environment == 'production' && '--prod' || '' }} \
            --yes
        working-directory: apps/admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}

  # ── Deploy Client Portal → Vercel ─────────────────────────────────────────────
  deploy-portal:
    name: Deploy Portal (Vercel)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy Portal to Vercel
        run: |
          npx vercel --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_TEAM_ID" \
            ${{ github.event.inputs.environment == 'production' && '--prod' || '' }} \
            --yes
        working-directory: apps/portal
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PORTAL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}

  # ── Notify deploy result ──────────────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-admin, deploy-portal]
    if: always()
    steps:
      - name: Deploy summary
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** ${{ needs.deploy-api.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Admin:** ${{ needs.deploy-admin.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Portal:** ${{ needs.deploy-portal.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
